      const [learningTrack, setLearningTrack] = useState('');

        if (prog.includes('RTC') && year === 'Second Year') {
          setYear('');
        }
        if (onProgrammeChange) onProgrammeChange(prog);
      };

        onStart({ gender, programme, year, learningTrack });

    function SwipeCardEngine({ category, card, nextCard, index, total, onSwipe, facultyName, trackName, onBack }) {
      const [dragX, setDragX] = useState(0);
      const [isAnimatingOut, setIsAnimatingOut] = useState(null); // 'left' | 'right' | null
      const [isDragging, setIsDragging] = useState(false);
      const [isSnappingBack, setIsSnappingBack] = useState(false);
      const startXRef = useRef(0);
      const isTransitioningRef = useRef(false);

      const triggerSwipe = (direction) => {
        if (isTransitioningRef.current || isAnimatingOut || !card) return;
        isTransitioningRef.current = true;

        if (window.confetti && direction === 'positive') {
          try {
            window.confetti({ particleCount: 25, spread: 60, origin: { x: 0.8, y: 0.6 } });
          } catch(e) {}
        }

        const resp = direction === 'positive' ? 'positive' : 'negative';
        setIsAnimatingOut(direction === 'positive' ? 'right' : 'left');

        setTimeout(() => {
          onSwipe(resp, card);
        }, 280);
      };

      // Reset on card change
      useEffect(() => {
        setDragX(0);
        setIsAnimatingOut(null);
        setIsSnappingBack(false);
        isTransitioningRef.current = false;
        setIsDragging(false);
      }, [card?.id]);

      // Keyboard arrow listener
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (isTransitioningRef.current || isAnimatingOut) return;
          if (e.key === 'ArrowLeft') triggerSwipe('negative');
          if (e.key === 'ArrowRight') triggerSwipe('positive');
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [card?.id, isAnimatingOut]);

      // Drag Handlers
      const handleTouchStart = (e) => {
        if (isTransitioningRef.current || isAnimatingOut) return;
        setIsDragging(true);
        setIsSnappingBack(false);
        startXRef.current = e.touches[0].clientX;
      };

      const handleTouchMove = (e) => {
        if (!isDragging) return;
        const currentX = e.touches[0].clientX;
        setDragX(currentX - startXRef.current);
      };

      const handleTouchEnd = () => {
        if (!isDragging) return;
        setIsDragging(false);
        if (dragX > 80) {
          triggerSwipe('positive');
        } else if (dragX < -80) {
          triggerSwipe('negative');
        } else {
          setIsSnappingBack(true);
          setDragX(0);
          setTimeout(() => setIsSnappingBack(false), 220);
        }
      };

      const handleMouseDown = (e) => {
        if (isTransitioningRef.current || isAnimatingOut) return;
        setIsDragging(true);
        setIsSnappingBack(false);
        startXRef.current = e.clientX;
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        setDragX(e.clientX - startXRef.current);
      };

      const handleMouseUp = () => {
        if (!isDragging) return;
        setIsDragging(false);
        if (dragX > 80) {
          triggerSwipe('positive');
        } else if (dragX < -80) {
          triggerSwipe('negative');
        } else {
          setIsSnappingBack(true);
          setDragX(0);
          setTimeout(() => setIsSnappingBack(false), 220);
        }
      };

      const rotation = dragX * 0.08;
      const positiveOpacity = isAnimatingOut === 'right' ? 1 : Math.min(1, Math.max(0, dragX / 80));
      const negativeOpacity = isAnimatingOut === 'left' ? 1 : Math.min(1, Math.max(0, -dragX / 80));

      const cardTransform = isAnimatingOut
        ? isAnimatingOut === 'right'
          ? 'translateX(150vw) rotate(30deg)'
          : 'translateX(-150vw) rotate(-30deg)'
        : `translateX(${dragX}px) rotate(${rotation}deg)`;

      const cardTransition = isAnimatingOut
        ? 'transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s ease-out'
        : isSnappingBack
        ? 'transform 0.22s ease-out'
        : 'none';

      return (
        <div 
          className="max-w-md mx-auto px-4 py-6 select-none"
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseUp}
        >
          {onBack && (
            <div className="mb-2 px-1">
              <button
                type="button"
                onClick={onBack}
                className="text-xs font-bold text-slate-500 hover:text-slate-800 transition-colors inline-flex items-center gap-1 py-1 px-2.5 rounded-lg hover:bg-slate-100"
              >
                <span>←</span>
                <span>Back to Categories</span>
              </button>
            </div>
          )}

          {/* Top Category / Faculty Header */}
          <div className="flex items-center justify-between text-xs font-black uppercase text-slate-500 mb-3 px-1">
            <span className="text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100">
              {facultyName ? `Faculty: ${facultyName}` : (category?.id === 'pedagogy' && trackName ? `Pedagogy • ${trackName}` : category?.name)}
            </span>
            <span className="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-bold">
              Card {index + 1} of {total}
            </span>
          </div>

          {/* Stack Container */}
          <div className="relative w-full min-h-[390px] mb-6">
            
            {/* 2nd Background Card (Preview underneath) */}
            {nextCard && (
              <div 
                className="absolute inset-0 bg-white rounded-3xl p-7 sm:p-9 tinder-card-shadow border border-slate-200/90 flex flex-col justify-between overflow-hidden pointer-events-none"
                style={{
                  transform: isAnimatingOut ? 'scale(1)' : 'scale(0.95) translateY(10px)',
                  opacity: isAnimatingOut ? 1 : 0.85,
                  transition: isAnimatingOut ? 'transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s' : 'none'
                }}
              >
                <div className="mt-6 text-center">
                  <span className="text-3xl mb-3 block">{category.icon || '📌'}</span>
                  <h2 className="text-2xl font-black text-slate-900 tracking-tight mb-3">
                    {nextCard.cardText}
                  </h2>
                  <p className="text-sm text-slate-500 font-medium leading-relaxed max-w-sm mx-auto">
                    {nextCard.description}
                  </p>
                </div>
                <div className="text-center pt-6 border-t border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                  Swipe Left or Right • or Use Buttons Below
                </div>
              </div>
            )}

            {/* Active Draggable Card */}
            <div 
              key={card.id}
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
              onMouseDown={handleMouseDown}
              style={{
                transform: cardTransform,
                transition: cardTransition,
                cursor: isDragging ? 'grabbing' : 'grab',
                opacity: isAnimatingOut ? 0 : 1,
                willChange: 'transform, opacity'
              }}
              className="absolute inset-0 bg-white rounded-3xl p-7 sm:p-9 tinder-card-shadow border border-slate-200/90 flex flex-col justify-between overflow-hidden select-none z-10"
            >
              {/* Dynamic Stamp Badges */}
              <div 
                style={{ opacity: positiveOpacity }}
                className="absolute top-6 left-6 swipe-badge-positive px-3.5 py-1.5 rounded-xl font-black text-xs tracking-wider uppercase rotate-[-12deg] pointer-events-none transition-opacity"
              >
                ✓ I LIKE IT
              </div>
              <div 
                style={{ opacity: negativeOpacity }}
                className="absolute top-6 right-6 swipe-badge-negative px-3.5 py-1.5 rounded-xl font-black text-xs tracking-wider uppercase rotate-[12deg] pointer-events-none transition-opacity"
              >
                ✕ I DON'T LIKE IT
              </div>

              {/* Card Content */}
              <div className="mt-6 text-center">
                <span className="text-3xl mb-3 block">{category.icon || '📌'}</span>
                <h2 className="text-2xl font-black text-slate-900 tracking-tight mb-3">
                  {card.cardText}
                </h2>
                <p className="text-sm text-slate-500 font-medium leading-relaxed max-w-sm mx-auto">
                  {card.description}
                </p>
              </div>

              {/* Bottom gesture helper */}
              <div className="text-center pt-6 border-t border-slate-100">
                <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                  Swipe Left or Right • or Use Buttons Below
                </div>
              </div>
            </div>
          </div>

          {/* Action Buttons */}
          <div className="grid grid-cols-2 gap-3">
            <button
              onClick={() => triggerSwipe('negative')}
              disabled={isAnimatingOut}
              className="py-4 px-4 bg-rose-50 hover:bg-rose-100 active:scale-95 text-rose-700 font-black text-xs sm:text-sm rounded-2xl border border-rose-200 transition-all flex items-center justify-center gap-1.5 shadow-sm disabled:opacity-50"
            >
              <span>←</span> I DON'T LIKE IT
            </button>
            <button
              onClick={() => triggerSwipe('positive')}
              disabled={isAnimatingOut}
              className="py-4 px-4 bg-emerald-50 hover:bg-emerald-100 active:scale-95 text-emerald-700 font-black text-xs sm:text-sm rounded-2xl border border-emerald-200 transition-all flex items-center justify-center gap-1.5 shadow-sm disabled:opacity-50"
            >
              I LIKE IT <span>→</span>
            </button>
          </div>
        </div>
      );
    }

    function FacultySelectionFlow({ session, facultyList, responses, onStartFacultySwiping, onDoneFaculty }) {

        if (/ananya/i.test(name)) return 'Karnalingesh';
        if (/aishwarya/i.test(name)) return 'Jeni Priya';
        if (/rajesh/i.test(name)) return 'Karnalingesh';
        if (/meenakshi/i.test(name)) return 'Jeni Priya';
        if (/vikram/i.test(name)) return 'Karnalingesh';
        if (/priya deshmukh/i.test(name)) return 'Jeni Priya';
        if (/siddharth/i.test(name)) return 'Karnalingesh';
        return name;

              </div>
              <div className="text-5xl sm:text-6xl font-black text-indigo-900">
                {happinessIndexScore}<span className="text-2xl text-indigo-600 font-bold">%</span>
              </div>
              <div className="text-xs font-bold text-indigo-600 mt-2">
                {positiveCount} Valued Items out of {totalResponses} total evaluations
              </div>
            </div>

            {/* Category breakdown */}
            <div className="text-left space-y-3 mb-8">
              <h4 className="text-xs font-black uppercase text-slate-400 tracking-wider">Evaluation Breakdown</h4>
              {ORDERED_CATEGORIES.map(cat => {
                const catResps = responses.filter(r => r.categoryId === cat.id);
                const pos = catResps.filter(r => r.response === 'positive').length;
                const pct = catResps.length > 0 ? Math.round((pos / catResps.length) * 100) : 0;

                return (
                  <div key={cat.id} className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200/80 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span>{cat.icon}</span>
                      <span className="text-xs font-black text-slate-800">{cat.name}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-xs text-slate-500 font-bold">{pos}/{catResps.length}</span>
                      <span className="text-xs font-black text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-lg">{pct}%</span>
                    </div>
                  </div>
                );
              })}
            </div>

            <button
              onClick={onReset}
              className="py-3.5 px-8 bg-slate-900 hover:bg-black text-white font-black text-xs rounded-2xl transition-all"
            >
              Start Another Anonymous Session
            </button>
          </div>
        </div>
      );
    }

    // ====================================================================
    // MAIN APPLICATION CONTAINER
    // ====================================================================
    function App() {
      const isResetRequested = () => {
        try {
          return window.location.hash.includes('reset') || window.location.search.includes('reset');
        } catch { return false; }
      };

      const [session, setSession] = useState(() => {
        if (isResetRequested()) {
          try {
            localStorage.removeItem('hi_anon_session');
            localStorage.removeItem('hi_anon_responses');
          } catch {}
          return null;
        }
        try {
          const saved = localStorage.getItem('hi_anon_session');
          return saved ? JSON.parse(saved) : null;
        } catch { return null; }
      });

      const [responses, setResponses] = useState(() => {
        if (isResetRequested()) return [];
        try {
          const saved = localStorage.getItem('hi_anon_responses');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [currentView, setCurrentView] = useState(() => (session && !isResetRequested()) ? 'categories' : 'onboarding');
      const [onboardingProgramme, setOnboardingProgramme] = useState('');
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [cardIndex, setCardIndex] = useState(0);
      const [activeFaculty, setActiveFaculty] = useState(null);
      const [showCompletionModal, setShowCompletionModal] = useState(false);

      const handleResetSession = () => {
        try {
          localStorage.removeItem('hi_anon_session');
          localStorage.removeItem('hi_anon_responses');
        } catch {}
        setSession(null);
        setResponses([]);
        setSelectedCategory(null);
        setCardIndex(0);
        setActiveFaculty(null);
        setShowCompletionModal(false);
        setOnboardingProgramme('');
        setCurrentView('onboarding');
      };

      // Save to localStorage
      useEffect(() => {
        if (session) {
          localStorage.setItem('hi_anon_session', JSON.stringify(session));
        } else {
          localStorage.removeItem('hi_anon_session');
        }
      }, [session]);

      useEffect(() => {
        localStorage.setItem('hi_anon_responses', JSON.stringify(responses));
      }, [responses]);

      // Category totals
      const categoriesWithTotals = useMemo(() => {
        if (!session) return ORDERED_CATEGORIES.map(c => ({ ...c, totalCards: 0 }));

        const applicableFac = INITIAL_FACULTY_LIST.filter(
          f => f.programme === session.programme && f.year === session.year
        );

        return ORDERED_CATEGORIES.map(c => {
          let count = 0;
          if (c.id === 'institution') count = OFFICIAL_FEEDBACK_CARDS.institution.length;
          if (c.id === 'pedagogy') count = 6;
          if (c.id === 'career') count = OFFICIAL_FEEDBACK_CARDS.career.length;
          if (c.id === 'campus_life') count = OFFICIAL_FEEDBACK_CARDS.campus_life.length;
          if (c.id === 'faculty') count = applicableFac.length * OFFICIAL_FACULTY_CARDS.length;
          return { ...c, totalCards: count };
        });
      }, [session]);

      const totalRequiredCards = useMemo(() => {
        return categoriesWithTotals.reduce((acc, c) => acc + c.totalCards, 0);
      }, [categoriesWithTotals]);

      const handleStartSession = (data) => {
        const sess = { id: 'sess_' + Date.now(), ...data };
        setSession(sess);
        setResponses([]);
        setCurrentView('categories');
      };

      const getCardsForCurrentCategory = () => {
        if (!selectedCategory) return [];
        if (selectedCategory === 'faculty') return OFFICIAL_FACULTY_CARDS;
        if (selectedCategory === 'pedagogy') {
          const tr = session?.learningTrack === 'Training-Based Learning'
            ? 'Training-Based Learning'
            : 'Project-Based Learning';
          return OFFICIAL_PEDAGOGY_CARDS[tr] || OFFICIAL_PEDAGOGY_CARDS['Project-Based Learning'];
        }
        return OFFICIAL_FEEDBACK_CARDS[selectedCategory] || [];
      };

      const handleSelectCategory = (catId) => {
        setSelectedCategory(catId);
        setCardIndex(0);
        if (catId === 'faculty') {
          setCurrentView('faculty_list');
        } else {
          setCurrentView('swiping');
        }
      };

      const handleStartFacultySwiping = (fac) => {
        setActiveFaculty(fac);
        setSelectedCategory('faculty');
        setCardIndex(0);
        setCurrentView('swiping');
      };

      const handleSwipe = (respType, card) => {
        const newResp = {
          sessionId: session.id,
          categoryId: selectedCategory,
          cardId: card.id,
          cardText: card.cardText,
          facultyId: activeFaculty ? activeFaculty.id : null,
          response: respType,
          score: respType === 'positive' ? 1 : 0,
          timestamp: new Date().toISOString()
        };

        const updated = [...responses, newResp];
        setResponses(updated);

        const currentCards = getCardsForCurrentCategory();
        if (cardIndex + 1 < currentCards.length) {
          setCardIndex(prev => prev + 1);
        } else {
          // Category / faculty completed
          if (selectedCategory === 'faculty') {
            setActiveFaculty(null);
            setCurrentView('faculty_list');
          } else {
            setShowCompletionModal(true);
          }
        }
      };

      const handleNextCategory = () => {
        setShowCompletionModal(false);
        const currentIndex = ORDERED_CATEGORIES.findIndex(c => c.id === selectedCategory);
        if (currentIndex < ORDERED_CATEGORIES.length - 1) {
          const nextCat = ORDERED_CATEGORIES[currentIndex + 1];
          handleSelectCategory(nextCat.id);
        } else {
          setCurrentView('categories');
        }
      };

      const handleReset = () => {
        localStorage.removeItem('hi_anon_session');
        localStorage.removeItem('hi_anon_responses');
        setSession(null);
        setOnboardingProgramme('');
        setResponses([]);
        setSelectedCategory(null);
        setActiveFaculty(null);
        setCurrentView('onboarding');
      };

      const currentCategoryObj = ORDERED_CATEGORIES.find(c => c.id === selectedCategory) || ORDERED_CATEGORIES[0];
      const activeCardsList = getCardsForCurrentCategory();
      const currentCard = activeCardsList[cardIndex];

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          <LogoHeader
            session={session || (onboardingProgramme ? { programme: onboardingProgramme } : null)}
            progress={responses.length}
            total={totalRequiredCards}
            onResetSession={handleResetSession}
          />

          <main className="flex-1 pb-12">
            {currentView === 'onboarding' && (
              <OnboardingModal 
                onStart={handleStartSession} 
                onProgrammeChange={setOnboardingProgramme}
              />
            )}

            {currentView === 'categories' && (
              <CategorySelection
                categories={categoriesWithTotals}
                responses={responses}
                totalRequiredCards={totalRequiredCards}
                onSelectCategory={handleSelectCategory}
                onCompleteAll={() => setCurrentView('final')}
                onResetSession={handleResetSession}
              />
            )}

            {currentView === 'faculty_list' && (
              <FacultySelectionFlow
                session={session}
                facultyList={INITIAL_FACULTY_LIST}
                responses={responses}
                onStartFacultySwiping={handleStartFacultySwiping}
                onDoneFaculty={() => {
                  const applicableFac = INITIAL_FACULTY_LIST.filter(
                    f => f.programme === session?.programme && f.year === session?.year
                  );
                  const allDone = applicableFac.length > 0 && applicableFac.every(
                    f => responses.filter(r => r.facultyId === f.id).length >= OFFICIAL_FACULTY_CARDS.length
                  );
                  if (allDone) {
                    setShowCompletionModal(true);
                  } else {
                    setCurrentView('categories');
                  }
                }}
              />
            )}

            {currentView === 'swiping' && currentCard && (
              <SwipeCardEngine
                key={currentCard.id}
                category={currentCategoryObj}
                card={currentCard}
                nextCard={activeCardsList[cardIndex + 1]}
                index={cardIndex}
                total={activeCardsList.length}
                facultyName={activeFaculty ? activeFaculty.facultyName : null}
                trackName={selectedCategory === 'pedagogy' ? session?.learningTrack : null}
                onSwipe={handleSwipe}
                onBack={() => {
                  if (selectedCategory === 'faculty') {
                    setCurrentView('faculty_list');
                  } else {
                    setCurrentView('categories');
                  }
                }}
              />
            )}

            {currentView === 'final' && (
              <FinalScreen
                session={session}
                responses={responses}
                onReset={handleReset}
              />
            )}

            {showCompletionModal && (
              <CategoryCompletionModal
                categoryName={currentCategoryObj.name}
                onNextCategory={handleNextCategory}
                onViewCategories={() => {
                  setShowCompletionModal(false);
                  setCurrentView('categories');
                }}
              />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
